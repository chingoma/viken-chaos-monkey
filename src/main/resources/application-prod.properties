# Production profile — chaos disabled; K8s requires explicit override
chaos.enabled=false
chaos.scheduler.enabled=false
chaos.k8s.enabled=${CHAOS_K8S_ENABLED:false}
chaos.environment=PROD
chaos.security.mode=iam
chaos.security.enabled=true
app.kafka.enabled=true

# Block real K8s unless break-glass env flag is set
chaos.k8s.prod-override=${CHAOS_K8S_PROD_OVERRIDE:false}
