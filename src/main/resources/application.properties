# Viken Chaos Monkey - Enterprise Configuration
# .properties only per enterprise guidelines

spring.application.name=viken-chaos-monkey

# Timezone (MANDATORY) - Africa/Dar_es_Salaam GMT+3
app.timezone=Africa/Dar_es_Salaam
spring.jackson.time-zone=Africa/Dar_es_Salaam
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Dar_es_Salaam

# Environment
chaos.environment=${CHAOS_ENVIRONMENT:LOCAL}

# Persistence: db (default) or file (legacy)
chaos.persistence.mode=${CHAOS_PERSISTENCE_MODE:db}

# Chaos Monkey Core
chaos.enabled=false
chaos.kill-switch-active=false
chaos.blast-radius-max-percent=10
chaos.excluded-services=payment-service,auth-service
chaos.state.file=./data/chaos-state.json

# Scheduler (property fallback; DB scheduler used when persistence.mode=db)
chaos.scheduler.enabled=false
chaos.scheduler.interval-ms=3600000
chaos.scheduler.poll-ms=60000

# Kubernetes (enable when running in K8s cluster)
chaos.k8s.enabled=false
chaos.k8s.namespace=chaos-engineering
chaos.k8s.in-cluster=true
chaos.k8s.prod-override=${CHAOS_K8S_PROD_OVERRIDE:false}

# Adapter toggles
chaos.adapters.http.enabled=false
chaos.adapters.http.allowed-hosts=
chaos.adapters.http.default-latency-ms=500
chaos.adapters.kafka.enabled=false
chaos.adapters.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
chaos.adapters.kafka.allowed-topics=chaos.test
chaos.adapters.db.enabled=false

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chaos_db}
spring.datasource.username=${DB_USER:chaos_user}
spring.datasource.password=${DB_PASSWORD:chaos_pass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Kafka audit
app.kafka.enabled=${APP_KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
kafka.topic.chaosAudit=audit.chaos.experiments

# Security: basic (default) or iam
chaos.security.mode=${CHAOS_SECURITY_MODE:basic}
chaos.security.enabled=true
chaos.security.viewer.username=${CHAOS_VIEWER_USERNAME:chaos-viewer}
chaos.security.viewer.password=${CHAOS_VIEWER_PASSWORD:change-me-viewer}
chaos.security.operator.username=${CHAOS_OPERATOR_USERNAME:chaos-operator}
chaos.security.operator.password=${CHAOS_OPERATOR_PASSWORD:change-me-operator}
chaos.security.admin.username=${CHAOS_ADMIN_USERNAME:chaos-admin}
chaos.security.admin.password=${CHAOS_ADMIN_PASSWORD:change-me-admin}
chaos.security.auditor.username=${CHAOS_AUDITOR_USERNAME:chaos-auditor}
chaos.security.auditor.password=${CHAOS_AUDITOR_PASSWORD:change-me-auditor}

# IAM / OIDC (when chaos.security.mode=iam)
app.iam.security.enabled=${APP_IAM_SECURITY_ENABLED:true}
app.iam.enforcement.enabled=${APP_IAM_ENFORCEMENT_ENABLED:true}
app.iam.jwt.issuer-uri=${APP_IAM_JWT_ISSUER_URI:http://localhost:10102/iam/api}
app.iam.jwt.jwks-uri=${APP_IAM_JWT_JWKS_URI:http://localhost:10102/iam/api/oauth2/jwks}
app.iam.jwt.audience=${APP_IAM_JWT_AUDIENCE:viken-chaos-monkey}

# Server
server.port=20000

# Actuator (Prometheus, health)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
