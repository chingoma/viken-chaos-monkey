# Viken Chaos Monkey - Enterprise Configuration
# .properties only per enterprise guidelines

spring.application.name=viken-chaos-monkey

# Timezone (MANDATORY) - Africa/Dar_es_Salaam GMT+3
spring.jackson.time-zone=Africa/Dar_es_Salaam

# Chaos Monkey Core
chaos.enabled=false
chaos.kill-switch-active=false
chaos.blast-radius-max-percent=10
chaos.excluded-services=payment-service,auth-service
chaos.state.file=./data/chaos-state.json

# Scheduler
chaos.scheduler.enabled=false
chaos.scheduler.interval-ms=3600000

# Kubernetes (enable when running in K8s cluster)
chaos.k8s.enabled=false
chaos.k8s.namespace=default
chaos.k8s.in-cluster=true

# Security and RBAC (override passwords via environment variables)
chaos.security.enabled=true
chaos.security.viewer.username=${CHAOS_VIEWER_USERNAME:chaos-viewer}
chaos.security.viewer.password=${CHAOS_VIEWER_PASSWORD:change-me-viewer}
chaos.security.operator.username=${CHAOS_OPERATOR_USERNAME:chaos-operator}
chaos.security.operator.password=${CHAOS_OPERATOR_PASSWORD:change-me-operator}
chaos.security.admin.username=${CHAOS_ADMIN_USERNAME:chaos-admin}
chaos.security.admin.password=${CHAOS_ADMIN_PASSWORD:change-me-admin}
chaos.security.auditor.username=${CHAOS_AUDITOR_USERNAME:chaos-auditor}
chaos.security.auditor.password=${CHAOS_AUDITOR_PASSWORD:change-me-auditor}

# Server
server.port=20000

# Actuator (Prometheus, health)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

