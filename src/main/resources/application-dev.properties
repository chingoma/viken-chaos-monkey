# Development profile - enable chaos for local testing
chaos.enabled=true
chaos.scheduler.enabled=true
chaos.scheduler.interval-ms=60000
chaos.excluded-services=
chaos.security.enabled=false
chaos.security.mode=basic
chaos.environment=LOCAL
chaos.persistence.mode=file
spring.flyway.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
