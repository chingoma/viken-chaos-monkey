# Viken Chaos Monkey — minimal RBAC for pod-kill experiments.
# Apply in the target namespace (default: chaos-engineering).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: viken-chaos-monkey
  namespace: chaos-engineering
  labels:
    app: viken-chaos-monkey
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: viken-chaos-monkey-pod-kill
  namespace: chaos-engineering
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: viken-chaos-monkey-pod-kill
  namespace: chaos-engineering
subjects:
  - kind: ServiceAccount
    name: viken-chaos-monkey
    namespace: chaos-engineering
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: viken-chaos-monkey-pod-kill
